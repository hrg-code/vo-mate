<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VO Mate - AI 自媒体工作台</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="side-nav" aria-label="主导航">
        <div class="brand">
          <div class="brand-mark">VO</div>
          <div>
            <strong>VO Mate</strong>
            <span>AI Creator Workbench</span>
          </div>
        </div>
        <nav class="nav-list" id="navList"></nav>
        <div class="collector-pill">
          <span class="status-dot"></span>
          <div>
            <strong>采集端在线</strong>
            <span>3 个任务运行中</span>
          </div>
        </div>
      </aside>

      <div class="workspace">
        <header class="top-bar">
          <div class="context-group">
            <button class="select-button" type="button">北极星内容组</button>
            <button class="select-button" type="button">抖音 · 程序员老陈</button>
          </div>
          <label class="global-search">
            <span aria-hidden="true">⌕</span>
            <input type="search" placeholder="搜索视频、选题、关键词、复盘" />
          </label>
          <div class="top-actions">
            <button class="icon-button" type="button" title="任务中心" aria-label="任务中心">◷</button>
            <button class="icon-button" type="button" title="通知" aria-label="通知">◇</button>
            <button class="avatar-button" type="button" aria-label="用户菜单">AL</button>
          </div>
        </header>

        <main class="main-content" id="app" tabindex="-1"></main>
      </div>
    </div>

    <div class="drawer-backdrop" id="drawerBackdrop" hidden></div>
    <aside class="drawer" id="drawer" aria-label="依据详情" aria-hidden="true">
      <div class="drawer-header">
        <div>
          <p class="eyebrow">Evidence Drawer</p>
          <h2>AI 建议依据</h2>
        </div>
        <button class="icon-button" type="button" id="closeDrawer" title="关闭" aria-label="关闭">×</button>
      </div>
      <div class="drawer-body" id="drawerBody"></div>
    </aside>

    <script src="app.js"></script>
  </body>
</html>
